<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Işık Şovu — Katıl</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background:#000; color:#e9e9ee; overflow:hidden;
    font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  #stage { position:fixed; inset:0; background:#000; z-index:1; }
  #gate { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px;
    background:radial-gradient(circle at 50% 40%, #1a1a24, #000); }
  #gate.hidden { display:none; }
  #gate h1 { font-size:24px; margin:0; }
  #gate p { color:#a0a0ad; margin:0; font-size:14px; max-width:320px; }
  #joinBtn { border:0; border-radius:16px; padding:22px 40px; font-size:20px; font-weight:700;
    color:#fff; background:#1f8f4e; }
  #status { position:fixed; top:0; left:0; right:0; z-index:5; padding:6px 10px; font-size:12px;
    font-family:ui-monospace,monospace; color:#9aa; background:rgba(0,0,0,.35); pointer-events:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f87171;
    margin-right:6px; vertical-align:middle; }
  .dot.on { background:#4ade80; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">bağlanılıyor…</span></div>
  <div id="gate">
    <h1>🔦 Işık Şovuna Katıl</h1>
    <p>Butona bas, kamera iznini ver. Telefonun sahnedeki komutlarla senkron yanıp sönecek.</p>
    <button id="joinBtn">Katıl</button>
    <p id="gateNote" style="font-size:12px;color:#8b8b98"></p>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://fwbtoktcjtfxairxdnqk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6IYn_AFX91VcX5tq2b_QoA_iBZMrKD9';
const CHANNEL = 'show';

const stage = document.getElementById('stage');
const gate = document.getElementById('gate');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');

// --- Bu telefonun kimliği: sabit rastgele faz (0..1). Dalga/sıra efektlerinin sırrı bu. ---
let phase = Math.random();
try { const s = localStorage.getItem('ph'); if (s) phase = +s; else localStorage.setItem('ph', phase); } catch(e){}

let track = null, torchSupported = false, curTorch = false, joined = false;
let effect = { action: 'off' };

// ---- Realtime ----
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const channel = sb.channel(CHANNEL, { config: { presence: { key: Math.random().toString(36).slice(2) } } });
channel.on('broadcast', { event: 'cmd' }, ({ payload }) => { effect = payload || { action:'off' }; });
channel.subscribe((s) => {
  const online = s === 'SUBSCRIBED';
  dot.classList.toggle('on', online);
  if (!joined) statusText.textContent = online ? 'bağlı — "Katıl"a bas' : ('durum: ' + s);
  if (online) channel.track({ t: Date.now() });
});

// ---- Renk yardımcıları ----
function hexRgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) }; }
function paint(hex, v){ const {r,g,b}=hexRgb(hex); const k=Math.max(0,Math.min(1,v));
  stage.style.background = `rgb(${r*k|0},${g*k|0},${b*k|0})`; }
function paintHSL(h, l){ stage.style.background = `hsl(${h|0} 100% ${Math.round(Math.max(0,Math.min(1,l))*50)}%)`; }
function setTorch(v){ if(v===curTorch) return; curTorch=v;
  if(track && torchSupported){ track.applyConstraints({advanced:[{torch:v}]}).catch(()=>{}); } }

// ---- Animasyon motoru: her kare, efekt + faz + ortak saatten kendi durumunu hesaplar ----
function frame(){
  const now = Date.now();
  const t = (now - (effect.startAt || now)) / 1000;   // efekt başından beri saniye
  const color = effect.color || '#ffffff';
  let torch = false;
  switch (effect.action) {
    case 'color':  paint(color, 1); break;
    case 'flash':  paint('#ffffff', 1); torch = true; break;
    case 'off':    paint('#000000', 0); break;

    case 'wave': {  // crowd boyunca gezen dalga — faz = konum
      const speed = effect.speed || 0.4;
      const v = 0.5 + 0.5 * Math.cos(2*Math.PI*(t*speed - phase));
      paint(color, v*v); torch = effect.torch && v > 0.75; break;
    }
    case 'twinkle': { // her telefon farklı anda parlar (yıldız serpme)
      const rate = effect.rate || 1.6;
      const on = Math.sin(2*Math.PI*(t*rate*(0.6+phase*0.9)) + phase*97) > 0.72;
      paint(color, on ? 1 : 0); break;
    }
    case 'rainbow': { // her telefonun rengi fazına göre → crowd gökkuşağı
      const speed = effect.speed || 0.08;
      paintHSL(((phase + t*speed) % 1) * 360, 1); break;
    }
    case 'chase': { // faz sırasına göre gruplar tek tek yanar
      const groups = effect.groups || 5, bpm = effect.bpm || 120;
      const myGroup = Math.min(groups-1, Math.floor(phase*groups));
      const active = Math.floor(t*bpm/60) % groups;
      const on = active === myGroup;
      paint(color, on ? 1 : 0.02); torch = effect.torch && on; break;
    }
    case 'pulse': { // hep birlikte nefes alma
      const bpm = effect.bpm || 60;
      const v = 0.5 + 0.5*Math.sin(2*Math.PI*t*bpm/60);
      paint(color, v); torch = effect.torch && v > 0.7; break;
    }
    case 'strobe': { // hep birlikte hızlı yanıp sönme
      const hz = effect.hz || 8;
      const on = (Math.floor(t*hz*2) % 2) === 0;
      paint(color, on ? 1 : 0); torch = effect.torch && on; break;
    }
    default: paint('#000000', 0);
  }
  setTorch(!!torch);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Katılım ----
document.getElementById('joinBtn').onclick = async () => {
  joined = true;
  gate.classList.add('hidden');
  statusText.textContent = 'bağlı — komut bekleniyor';
  try { await navigator.wakeLock.request('screen'); } catch(e){}
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  if (!window.isSecureContext) { statusText.textContent = 'HTTPS gerekli — flaş yok, ekranla katılıyorsun'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    torchSupported = !!caps.torch;
    statusText.textContent = torchSupported ? 'flaş hazır ✔ komut bekleniyor' : 'flaş yok; ekranla katılıyorsun';
  } catch(e) { statusText.textContent = 'kamera reddedildi; ekranla katılıyorsun'; }
};
</script>
</body>
</html>
