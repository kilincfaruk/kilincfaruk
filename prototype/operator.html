<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Işık Şovu — Operatör</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100dvh; background:#0b0b0f; color:#e9e9ee; padding:16px;
    font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; gap:12px; max-width:560px; margin-inline:auto; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:18px; margin:0; }
  #count { font-size:13px; font-family:ui-monospace,monospace; color:#9aa;
    background:#16161d; border:1px solid #26262f; padding:6px 10px; border-radius:10px; white-space:nowrap; }
  #count b { color:#4ade80; font-size:16px; }
  #conn { font-size:12px; font-family:ui-monospace,monospace; color:#f87171; margin-top:-4px; }
  .section { font-size:11px; color:#8b8b98; text-transform:uppercase; letter-spacing:.06em; margin-top:6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid.three { grid-template-columns:1fr 1fr 1fr; }
  button { appearance:none; border:0; border-radius:13px; padding:18px 10px; font-size:16px;
    font-weight:700; color:#fff; background:#2b2b36; transition:transform .05s; touch-action:manipulation; }
  button:active { transform:scale(.96); }
  .b-flash{background:#c9a227;color:#000;} .b-off{background:#3a3a46;}
  .b-red{background:#dc2626;} .b-green{background:#16a34a;} .b-blue{background:#2563eb;} .b-white{background:#e5e7eb;color:#000;}
  .fx{background:#4338ca;} .fx2{background:#7c3aed;} .fx3{background:#0891b2;} .fx4{background:#db2777;}
  .controls { background:#14141b; border:1px solid #24242e; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; gap:10px; font-size:13px; }
  .row label { width:70px; color:#b9b9c4; }
  .row input[type=range]{ flex:1; }
  .row .val { width:52px; text-align:right; font-family:ui-monospace,monospace; color:#9aa; }
  .row input[type=color]{ width:44px; height:32px; border:0; background:none; padding:0; }
  .chk { display:flex; align-items:center; gap:8px; font-size:13px; color:#b9b9c4; }
  a.link { color:#6ea8fe; font-size:13px; word-break:break-all; }
</style>
</head>
<body>
  <header>
    <h1>🎛️ Işık Şovu — Operatör</h1>
    <div id="count">Bağlı: <b id="n">0</b> telefon</div>
  </header>
  <div id="conn">bağlanılıyor…</div>

  <div class="section">Temel</div>
  <div class="grid three">
    <button class="b-flash" data-a="flash">Flaş AÇ 🔦</button>
    <button class="b-white" data-a="color" data-useclr="1">Beyaz</button>
    <button class="b-off"   data-a="off">KAPAT</button>
  </div>

  <div class="section">Renk (hepsi aynı)</div>
  <div class="grid three">
    <button class="b-red"   data-a="color" data-color="#ff0000">Kırmızı</button>
    <button class="b-green" data-a="color" data-color="#00ff00">Yeşil</button>
    <button class="b-blue"  data-a="color" data-color="#0000ff">Mavi</button>
  </div>

  <div class="section">Efektler (sayı arttıkça güzelleşir)</div>
  <div class="grid">
    <button class="fx"  data-a="wave">🌊 Dalga</button>
    <button class="fx2" data-a="chase">🏃 Sıralı</button>
    <button class="fx3" data-a="twinkle">✨ Serpme</button>
    <button class="fx4" data-a="rainbow">🌈 Gökkuşağı</button>
    <button class="fx"  data-a="pulse">💓 Nabız</button>
    <button class="fx2" data-a="strobe">⚡ Strobe</button>
  </div>

  <div class="section">Ayarlar</div>
  <div class="controls">
    <div class="row"><label>Renk</label><input type="color" id="clr" value="#00e5ff">
      <span class="val" id="clrHint" style="flex:1;text-align:left">efekt rengi</span></div>
    <div class="row"><label>Hız</label><input type="range" id="speed" min="0.05" max="1.5" step="0.05" value="0.4">
      <span class="val" id="speedV">0.40</span></div>
    <div class="row"><label>BPM</label><input type="range" id="bpm" min="40" max="220" step="2" value="120">
      <span class="val" id="bpmV">120</span></div>
    <div class="row"><label>Grup</label><input type="range" id="groups" min="2" max="12" step="1" value="5">
      <span class="val" id="groupsV">5</span></div>
    <label class="chk"><input type="checkbox" id="torch"> Flaşı da kullan (yavaş efektlerde)</label>
  </div>

  <p><a class="link" id="plink" href="participant.html" target="_blank">📱 Katılımcı linkini aç / paylaş</a></p>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://fwbtoktcjtfxairxdnqk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6IYn_AFX91VcX5tq2b_QoA_iBZMrKD9';
const CHANNEL = 'show';

const $ = id => document.getElementById(id);
const conn = $('conn'), nEl = $('n');
let ready = false;

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const channel = sb.channel(CHANNEL, { config: { presence: { key: 'operator' } } });

channel.on('presence', { event: 'sync' }, () => {
  const state = channel.presenceState();
  nEl.textContent = Object.keys(state).filter(k => k !== 'operator').length;
});
channel.subscribe((s) => {
  ready = s === 'SUBSCRIBED';
  conn.textContent = ready ? '● bağlı — komut göndermeye hazır' : ('durum: ' + s);
  conn.style.color = ready ? '#4ade80' : '#f87171';
  if (ready) channel.track({ role: 'operator' });
});

// Slider değerlerini göster
$('speed').oninput  = () => $('speedV').textContent  = (+$('speed').value).toFixed(2);
$('bpm').oninput    = () => $('bpmV').textContent    = $('bpm').value;
$('groups').oninput = () => $('groupsV').textContent = $('groups').value;

function send(action, opts = {}) {
  if (!ready) return;
  const payload = {
    action,
    startAt: Date.now() + 250,           // tüm telefonlar için ortak başlangıç
    color: opts.color || $('clr').value,
    speed: +$('speed').value,
    bpm: +$('bpm').value,
    groups: +$('groups').value,
    rate: +$('speed').value * 3.5,
    hz: Math.max(2, Math.round(+$('bpm').value / 15)),
    torch: $('torch').checked,
  };
  channel.send({ type: 'broadcast', event: 'cmd', payload });
}

document.querySelectorAll('button[data-a]').forEach(btn => {
  btn.addEventListener('click', () => {
    const a = btn.dataset.a;
    const opts = {};
    if (btn.dataset.color) opts.color = btn.dataset.color;   // sabit renkli butonlar
    send(a, opts);
  });
});

$('plink').href = new URL('participant.html', location.href).href;
</script>
</body>
</html>
