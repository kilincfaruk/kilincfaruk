<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Işık Şovu — Operatör</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0a0a10; --card:#13131b; --card2:#0d0d14; --line:#232331; --line2:#2e2e40;
    --txt:#eceaf2; --mut:#9a98a8; --dim:#6c6a7a; --acc:#6ea8fe; --ok:#4ade80; --bad:#f87171;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100dvh; background:radial-gradient(1200px 600px at 50% -200px, #17172a, var(--bg));
    color:var(--txt); padding:16px; font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    max-width:960px; margin-inline:auto;
  }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; letter-spacing:.01em; }
  .pills { display:flex; gap:8px; align-items:center; }
  .pill { font-size:12px; font-family:ui-monospace,monospace; color:var(--mut);
    background:var(--card); border:1px solid var(--line); padding:6px 11px; border-radius:99px; white-space:nowrap; }
  .pill b { color:var(--ok); font-size:14px; }
  #conn.pill { color:var(--bad); }
  #conn.pill.ok { color:var(--ok); }

  .cols { display:flex; flex-direction:column; gap:14px; }
  @media (min-width:880px){ .cols { display:grid; grid-template-columns:1.15fr .85fr; align-items:start; } }
  .col { display:flex; flex-direction:column; gap:14px; min-width:0; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .card h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em;
    margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card h2 .now { color:var(--acc); text-transform:none; letter-spacing:0; font-family:ui-monospace,monospace; font-size:12px; }

  /* Sanal telefon sürüsü */
  #phones { display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:9px;
    background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .phone { aspect-ratio:9/19; border-radius:8px; background:#1b1b26; border:1px solid var(--line2); padding:3px; }
  .phone .scr { position:relative; width:100%; height:100%; border-radius:5px; background:#000; overflow:hidden; }
  .phone .fl { position:absolute; top:3px; left:50%; transform:translateX(-50%); width:5px; height:5px;
    border-radius:50%; background:#fff; box-shadow:0 0 7px 2.5px rgba(255,255,235,.95); opacity:0; }

  /* Renk paleti */
  #swatches { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .sw { position:relative; aspect-ratio:1; border-radius:50%; border:2px solid transparent;
    cursor:pointer; padding:0; transition:transform .08s; }
  .sw:active { transform:scale(.9); }
  .sw.sel { border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.18), 0 0 14px -2px currentColor; }
  .sw.sel::after { content:'✓'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:15px; font-weight:900; color:#000; text-shadow:0 0 3px rgba(255,255,255,.8); }
  #palHint { font-size:12px; color:var(--mut); margin:10px 0 0; line-height:1.5; }

  .seg { display:flex; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:3px; margin-top:10px; }
  .seg button { flex:1; border:0; background:none; color:var(--mut); font-size:13px; font-weight:600;
    padding:9px 6px; border-radius:8px; cursor:pointer; }
  .seg button.active { background:#2a2a3d; color:var(--txt); }

  /* Efektler */
  .fxgrid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .fxgrid button {
    appearance:none; border:1px solid var(--line2); border-radius:12px; padding:15px 8px;
    font-size:15px; font-weight:700; color:var(--txt); background:linear-gradient(180deg,#22222f,#191922);
    transition:transform .05s; touch-action:manipulation; cursor:pointer;
  }
  .fxgrid button:active { transform:scale(.96); }
  .fxgrid button.active { border-color:#fff; box-shadow:0 0 0 1px #fff inset; }
  #offBtn { width:100%; margin-top:9px; border:0; border-radius:12px; padding:16px; font-size:16px;
    font-weight:800; color:#fff; background:#7f1d1d; cursor:pointer; }
  #offBtn:active { transform:scale(.98); }

  /* Ayarlar */
  .row { display:flex; align-items:center; gap:10px; font-size:13px; margin-top:10px; }
  .row:first-of-type { margin-top:0; }
  .row label { width:96px; color:var(--mut); flex-shrink:0; }
  .row input[type=range] { flex:1; accent-color:var(--acc); }
  .row .val { width:44px; text-align:right; font-family:ui-monospace,monospace; color:var(--mut); }
  .chk { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mut); margin-top:12px; }

  /* QR / link */
  #qrbox { display:flex; gap:14px; align-items:center; }
  #qrimg { width:108px; height:108px; border-radius:10px; background:#fff; padding:6px; display:none; }
  #qrbox .info { font-size:13px; color:var(--mut); line-height:1.6; min-width:0; }
  a.link { color:var(--acc); word-break:break-all; }
</style>
</head>
<body>
  <header>
    <h1>🎛️ Işık Şovu — Operatör</h1>
    <div class="pills">
      <span class="pill">📱 Gerçek: <b id="n">0</b></span>
      <span class="pill">🖥️ Önizleme: <b id="pv">36</b></span>
      <span class="pill" id="conn">bağlanıyor…</span>
    </div>
  </header>

  <div class="cols">
    <div class="col">
      <div class="card">
        <h2>Önizleme — sanal telefonlar <span class="now" id="nowFx">off</span></h2>
        <div id="phones"></div>
      </div>

      <div class="card">
        <h2>Renk paleti <span class="now" id="palCount">2 renk</span></h2>
        <div id="swatches"></div>
        <div class="seg" id="modeSeg">
          <button data-mode="split" class="active">🎨 Karışık</button>
          <button data-mode="cycle">🔁 Sırayla</button>
        </div>
        <p id="palHint"></p>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2>Efektler</h2>
        <div class="fxgrid">
          <button data-a="color">🎨 Renk Yak</button>
          <button data-a="flash">🔦 Flaş</button>
          <button data-a="wave">🌊 Dalga</button>
          <button data-a="chase">🏃 Sıralı</button>
          <button data-a="twinkle">✨ Serpme</button>
          <button data-a="pulse">💓 Nabız</button>
          <button data-a="strobe">⚡ Strobe</button>
          <button data-a="rainbow">🌈 Gökkuşağı</button>
        </div>
        <button id="offBtn" data-a="off">⏹ KAPAT</button>
      </div>

      <div class="card">
        <h2>Ayarlar</h2>
        <div class="row"><label>Hız</label><input type="range" id="speed" min="0.05" max="1.5" step="0.05" value="0.4"><span class="val" id="speedV">0.40</span></div>
        <div class="row"><label>BPM</label><input type="range" id="bpm" min="40" max="220" step="2" value="120"><span class="val" id="bpmV">120</span></div>
        <div class="row"><label>Grup</label><input type="range" id="groups" min="2" max="12" step="1" value="5"><span class="val" id="groupsV">5</span></div>
        <div class="row"><label>Önizleme adet</label><input type="range" id="pvCount" min="4" max="120" step="1" value="36"><span class="val" id="pvCountV">36</span></div>
        <label class="chk"><input type="checkbox" id="torch"> 🔦 Flaşı da kullan (yavaş efektlerde)</label>
      </div>

      <div class="card">
        <h2>Katılımcılar için</h2>
        <div id="qrbox">
          <img id="qrimg" alt="Katılımcı QR">
          <div class="info">Telefonlar bu QR'ı okutsun ya da linki açsın:<br>
            <a class="link" id="plink" href="participant.html" target="_blank">participant.html</a></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { fxState } from './engine.js';

const SUPABASE_URL = 'https://fwbtoktcjtfxairxdnqk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6IYn_AFX91VcX5tq2b_QoA_iBZMrKD9';
const CHANNEL = 'show';

const $ = (id) => document.getElementById(id);
let ready = false;
let effect = { action: 'off' };
let last = null; // canlı ayar güncellemesi için son gönderilen {action}

// ---------- Renk paleti ----------
const PALETTE = [
  ['#ff3b30','Kırmızı'], ['#ff9500','Turuncu'], ['#ffd60a','Sarı'], ['#34c759','Yeşil'], ['#00e5ff','Camgöbeği'],
  ['#007aff','Mavi'], ['#5e5ce6','İndigo'], ['#bf5af2','Lila'], ['#ff2d92','Pembe'], ['#ffffff','Beyaz'],
];
let selected = new Set(['#00e5ff', '#ff2d92']);
let mode = 'split';

const swWrap = $('swatches');
for (const [hex, name] of PALETTE) {
  const b = document.createElement('button');
  b.className = 'sw' + (selected.has(hex) ? ' sel' : '');
  b.style.background = hex; b.style.color = hex;
  b.title = name; b.setAttribute('aria-label', name);
  b.onclick = () => {
    if (selected.has(hex)) {
      if (selected.size === 1) return;       // en az 1 renk kalmalı
      selected.delete(hex); b.classList.remove('sel');
    } else {
      selected.add(hex); b.classList.add('sel');
    }
    updatePalHint(); reapply();
  };
  swWrap.appendChild(b);
}

$('modeSeg').querySelectorAll('button').forEach((b) => {
  b.onclick = () => {
    mode = b.dataset.mode;
    $('modeSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
    updatePalHint(); reapply();
  };
});

function selColors() {
  // Palet sırasını koru (Set ekleme sırası yerine görsel sıra)
  return PALETTE.map(([h]) => h).filter((h) => selected.has(h));
}
function updatePalHint() {
  const n = selected.size;
  $('palCount').textContent = n + ' renk';
  $('palHint').textContent = n === 1
    ? 'Tek renk: herkes aynı renkte yanar.'
    : (mode === 'split'
        ? `${n} renk · Karışık: kalabalık ${n} renk grubuna bölünür (herkesin rengi sabit).`
        : `${n} renk · Sırayla: herkes birlikte, iki vuruşta bir sıradaki renge geçer (BPM'e bağlı).`);
}
updatePalHint();

// ---------- Sanal telefon sürüsü ----------
const phonesEl = $('phones');
let phones = [];
function buildPhones(count) {
  phonesEl.innerHTML = '';
  phones = [];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div'); p.className = 'phone';
    const s = document.createElement('div'); s.className = 'scr';
    const f = document.createElement('i');  f.className = 'fl';
    s.appendChild(f); p.appendChild(s); phonesEl.appendChild(p);
    phones.push({ scr: s, fl: f, phase: Math.random() });
  }
  $('pv').textContent = count;
}
buildPhones(36);

function loop() {
  const now = Date.now();
  for (const ph of phones) {
    const st = fxState(effect, ph.phase, now);
    ph.scr.style.background = st.css;
    ph.fl.style.opacity = st.torch ? 1 : 0;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Realtime ----------
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const channel = sb.channel(CHANNEL, { config: { presence: { key: 'operator' } } });
channel.on('presence', { event: 'sync' }, () => {
  const st = channel.presenceState();
  $('n').textContent = Object.keys(st).filter((k) => k !== 'operator').length;
});
channel.subscribe((s) => {
  ready = s === 'SUBSCRIBED';
  $('conn').textContent = ready ? '● bağlı' : s.toLowerCase();
  $('conn').classList.toggle('ok', ready);
  if (ready) channel.track({ role: 'operator' });
});

// ---------- Komut gönderimi ----------
function buildPayload(action) {
  const colors = selColors();
  return {
    action,
    startAt: Date.now() + 250,     // ortak başlangıç anı
    colors,
    color: colors[0],              // eski katılımcı sürümleriyle uyum
    mode,
    speed: +$('speed').value,
    bpm: +$('bpm').value,
    groups: +$('groups').value,
    rate: +$('speed').value * 3.5,
    hz: Math.max(2, Math.round(+$('bpm').value / 15)),
    torch: $('torch').checked,
  };
}

function apply(action, markBtn) {
  last = action;
  const payload = buildPayload(action);
  effect = payload;
  $('nowFx').textContent = action;
  document.querySelectorAll('[data-a]').forEach((b) => b.classList.remove('active'));
  if (markBtn) markBtn.classList.add('active');
  if (ready) channel.send({ type: 'broadcast', event: 'cmd', payload });
}

// Palet/mod/slider değişince aktif efekti canlı güncelle
function reapply() {
  if (last && last !== 'off') {
    const btn = document.querySelector(`[data-a="${last}"]`);
    apply(last, btn);
  }
}

document.querySelectorAll('[data-a]').forEach((btn) => {
  btn.addEventListener('click', () => apply(btn.dataset.a, btn.dataset.a === 'off' ? null : btn));
});

$('speed').oninput   = () => $('speedV').textContent  = (+$('speed').value).toFixed(2);
$('bpm').oninput     = () => $('bpmV').textContent    = $('bpm').value;
$('groups').oninput  = () => $('groupsV').textContent = $('groups').value;
$('pvCount').oninput = () => { $('pvCountV').textContent = $('pvCount').value; buildPhones(+$('pvCount').value); };
['speed', 'bpm', 'groups', 'torch'].forEach((id) => $(id).addEventListener('change', reapply));

// ---------- Katılımcı linki + QR ----------
const pUrl = new URL('participant.html', location.href).href;
$('plink').href = pUrl;
$('plink').textContent = pUrl.replace(/^https?:\/\//, '');
(async () => {
  try {
    const QR = (await import('https://esm.sh/qrcode@1.5.4')).default;
    $('qrimg').src = await QR.toDataURL(pUrl, { width: 216, margin: 1 });
    $('qrimg').style.display = 'block';
  } catch (e) { /* QR kütüphanesi yüklenemedi — link yeterli */ }
})();
</script>
</body>
</html>
